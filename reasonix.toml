dy = @{ query = $sql } | ConvertTo-Json -Depth 3\ncurl.exe -s -X POST \"https://api.supabase.com/v1/projects/jubdbsjsalpecfvseskz/database/query\" -H \"Authorization: Bearer $token\" -H \"Content-Type: application/json\" -d $body", "Bash=Get-Content .env.local | ForEach-Object { if ($_ -match '^\\s*([A-Z_]+)\\s*=') { $matches[1] } }", "Bash=$tmp = Join-Path $env:TEMP \"lms-progress-probe.mjs\"; @'\nimport { readFileSync } from \"node:fs\";\n\nconst env = Object.fromEntries(\n  readFileSync(\".env.local\", \"utf8\")\n    .split(/\\r?\\n/)\n    .filter((l) => l && !l.startsWith(\"#\") && l.includes(\"=\"))\n    .map((l) => {\n      const i = l.indexOf(\"=\");\n      return [l.slice(0, i).trim(), l.slice(i + 1).trim()];\n    })\n);\n\nconst base = env.NEXT_PUBLIC_SUPABASE_URL;\nconst key = env.SUPABASE_SERVICE_ROLE_KEY;\nconst headers = { apikey: key, Authorization: `Bearer ${key}` };\nconst q = async (path) => {\n  const res = await fetch(`${base}/rest/v1/${path}`, { headers });\n  if (!res.ok) throw new Error(`${path}: ${res.status} ${await res.text()}`);\n  return res.json();\n};\n\n// 1. home 视图开启的课程\nconst homeItems = await q(`course_tree_view_items?select=entity_type,entity_id&view_slug=eq.home`);\nconst homeCourses = homeItems.filter((i) => i.entity_type === \"course\").map((i) => i.entity_id);\nconsole.log(\"home 视图课程数:\", homeCourses.length);\n\nif (homeCourses.length === 0) {\n  console.log(\"home 视图未开启任何课程 → 综合完成度应为 0%（非 5%）\");\n  process.exit(0);\n}\n\n// 2. 这些课程下的已发布课时\nconst courseList = homeCourses.map((id) => `\"${id}\"`).join(\",\");\nconst lessons = await q(`lessons?select=id,course_id&is_published=eq.true&course_id=in.(${courseList})`);\nconsole.log(\"可见课时总数:\", lessons.length);\n\n// 3. 所有进度记录\nconst progress = await q(`lesson_progress?select=user_id,lesson_id,status,progress_percent`);\nconst byUser = new Map();\nfor (const row of progress) {\n  if (!byUser.has(row.user_id)) byUser.set(row.user_id, []);\n  byUser.get(row.user_id).push(row);\n}\n\n// 4. 按新口径算每个学生的综合完成度\nconst lessonIds = new Set(lessons.map((l) => String(l.id)));\nconst results = [];\nfor (const [uid, rows] of byUser) {\n  const rowsByLesson = new Map(rows.map((r) => [String(r.lesson_id), r]));\n  let sum = 0;\n  for (const lid of lessonIds) {\n    const row = rowsByLesson.get(lid);\n    if (!row) continue;\n    sum += row.status === \"completed\" ? 100 : (row.progress_percent ?? 0);\n  }\n  const pct = Math.round(sum / lessonIds.size);\n  results.push({ uid, pct, learned: rows.filter((r) => lessonIds.has(String(r.lesson_id))).length });\n}\nresults.sort((a, b) => a.pct - b.pct);\nconsole.log(\"\\n各学生综合完成度（新口径）：\");\nfor (const r of results) console.log(`  ${r.pct}%  学过可见课时 ${r.learned}/${lessonIds.size}  user=${r.uid}`);\n'@ | Set-Content -Encoding UTF8 $tmp; node $tmp", "Bash=$tmp = Join-Path $env:TEMP \"lms-profile-probe.mjs\"; @'\nimport { readFileSync } from \"node:fs\";\nconst env = Object.fromEntries(\n  readFileSync(\".env.local\", \"utf8\").split(/\\r?\\n/).filter((l) => l && !l.startsWith(\"#\") && l.includes(\"=\")).map((l) => { const i = l.indexOf(\"=\"); return [l.slice(0, i).trim(), l.slice(i + 1).trim()]; })\n);\nconst base = env.NEXT_PUBLIC_SUPABASE_URL;\nconst key = env.SUPABASE_SERVICE_ROLE_KEY;\nconst headers = { apikey: key, Authorization: `Bearer ${key}` };\nconst ids = [\"2b438ee6-5fa9-4983-89ad-a43df4f46fc7\", \"fbec91b2-5386-4bc0-bb38-6ac0cd34687f\"].map((i) => `\"${i}\"`).join(\",\");\nconst res = await fetch(`${base}/rest/v1/profiles?select=id,full_name,email,role&id=in.(${ids})`, { headers });\nconsole.log(JSON.stringify(await res.json(), null, 2));\n'@ | Set-Content -Encoding UTF8 $tmp; node $tmp"]
